name: Release Pipeline (Documentation Test)

on:
  release:
    # Triggered when a GitHub Release is created (either manually or by semantic-release)
    types: [published]

jobs:
  get_notes_and_call:
    runs-on: ubuntu-latest
    outputs:
      release_notes: ${{ steps.get_notes.outputs.release_notes }} # Expose notes for the next job

    steps:
      - name: Extract Release Notes Body
        id: get_notes
        run: |
          # Extracts the notes written into the GitHub Release description box
          NOTES=$(jq -r '.release.body' $GITHUB_EVENT_PATH)
          # Set the output variable to be passed as input
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          
  call_template:
    needs: get_notes_and_call # Wait for the notes to be extracted
    uses: your-org/cicd-templates/.github/workflows/standard_release.yml@main
    with:
      repository_name: ${{ github.event.repository.name }}
      release_tag: ${{ github.event.release.tag_name }}
      # Pass the extracted notes from the previous job
      release_notes: ${{ needs.get_notes_and_call.outputs.release_notes }}
